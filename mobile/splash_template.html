<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&display=swap');
    
    body {
      margin: 0;
      padding: 0;
      width: 1024px;
      height: 1024px;
      background-color: #F7F9FC;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Outfit', system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    .logo-container {
      text-align: center;
      margin-top: -60px; /* Slight optical adjustment */
    }
    .logo-text {
      font-size: 110px;
      line-height: 1;
      letter-spacing: -3px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }
    .store {
      font-weight: 300;
      color: #9CA3AF;
    }
    .ville {
      font-weight: 700;
      color: #0F172A;
    }
    .tm {
      font-weight: 700;
      color: #2DD4BF;
      font-size: 24px;
      margin-top: 10px;
      margin-left: 5px;
      letter-spacing: 0;
    }
    .subtitle {
      margin-top: 25px;
      font-size: 18px;
      font-weight: 400;
      color: #9CA3AF;
      letter-spacing: 12px;
      text-transform: uppercase;
      padding-left: 12px; /* optical balance for letter spacing */
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <div class="logo-text">
      <span class="store">Store</span><span class="ville">Ville</span><span class="tm">TM</span>
    </div>
    <div class="subtitle">The Digital Mall of Ethiopia</div>
  </div>
</body>
</html>
